name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 같은 브랜치/PR에서 새 커밋이 올라오면 이전 실행을 취소해 러너 낭비를 줄인다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙: 포맷 검사에는 저장소 읽기 권한만 필요하다.
permissions:
  contents: read

jobs:
  check:
    name: Format & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 체크아웃 이후 GITHUB_TOKEN을 로컬 git 설정에 남기지 않는다.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # google-java-format 기준으로 포맷 준수 여부만 검사한다. 위반 시 spotlessApply 안내와 함께 실패한다.
      - name: Format Check (spotless)
        run: ./gradlew spotlessCheck --no-daemon

      # 컴파일/패키징 검증. 테스트는 CI에서 제외하므로 build 대신 assemble을 쓴다.
      - name: Build (테스트 제외)
        run: ./gradlew assemble --no-daemon
