spring:
  datasource:
    url: jdbc:h2:mem:youthpick-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

youthpick:
  jwt:
    secret: test-secret-key-please-be-long-enough-for-hs256
    access-token-expiration: 30m
    refresh-token-expiration: 14d
  oauth:
    frontend-callback-uri: http://localhost:3000/oauth/callback
