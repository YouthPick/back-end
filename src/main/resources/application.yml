spring:
  profiles:
    active: local
  flyway:
    # 기본 비활성(안전 기본값) — MySQL을 쓰는 프로필(local, 추후 prod)이 각자 true로 켠다.
    # test는 H2 + ddl-auto(create-drop)라 꺼진 기본값을 그대로 쓴다.
    enabled: false
    # DDL(migration)과 데이터 적재(seed)를 폴더로 분리. 버전(V{n})은 두 폴더에 걸쳐 하나의 순서를 공유한다.
    locations:
      - classpath:db/migration
      - classpath:db/seed
  http:
    client:
      # OAuthClient 등 자동구성된 RestClient.Builder에 전역 적용. provider가 응답이 없을 때
      # 스레드/DB 커넥션을 오래 붙잡지 않도록 한다.
      connect-timeout: 3s
      read-timeout: 5s

youthpick:
  auth:
    refresh-cookie:
      # 운영 안전 기본값: 프론트/백엔드가 서로 다른 도메인(크로스사이트)이라 SameSite=None + Secure가 필수.
      # 로컬(application-local.yml)은 http라 secure=false, localhost 동일 사이트라 SameSite=Lax로 완화한다.
      path: /api/v1/auth
      secure: true
      same-site: None