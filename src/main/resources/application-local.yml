# 로컬 개발: docker compose up -d 로 MySQL/Redis 먼저 띄운 뒤 앱 실행.
# 스키마는 Flyway(db/migration)가 만들고, JPA는 엔티티와 일치하는지 검증만 한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/youthpick?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    # 기본값 youthpick은 로컬 compose MySQL의 기본 계정(운영 자격증명 아님).
    # docker-compose.yml의 fallback과 짝이며, .env로 계정을 바꿨다면 앱에도 같은 값을 env로 넘겨야 한다.
    username: ${DB_USERNAME:youthpick}
    password: ${DB_PASSWORD:youthpick}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    # 로컬 compose의 elasticsearch 서비스. 타임아웃 등 동작 규칙은 application.yml에 있다.
    uris: ${ES_URIS:http://localhost:9200}

youthpick:
  search:
    enabled: ${SEARCH_ES_ENABLED:true}   # 로컬은 compose로 ES를 띄우므로 켠다 (기본 off)
    reindex-on-empty: ${SEARCH_ES_REINDEX_ON_EMPTY:true}   # 인덱스가 비어 있으면 채운다 (기본 off)
  minio:
    # 로컬 compose의 기본값과 짝이다. 배포 환경은 application.yml의 환경변수 필수 설정을 사용한다.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
  jwt:
    # 서명 secret은 DB 계정과 달리 토큰 위조 가능성과 직결되므로 fallback을 두지 않는다.
    # 로컬에서도 .env(또는 셸 export)로 JWT_SECRET을 반드시 설정한다.
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}
  auth:
    refresh-cookie:
      # 로컬은 http(비TLS)라 secure=false. localhost:5173↔localhost:8080은 포트만 다른 동일 사이트라
      # SameSite=Lax로도 쿠키가 정상 전송된다(운영은 application.yml의 SameSite=None+Secure 기본값을 쓴다).
      secure: false
      same-site: Lax
  sync:
    startup-on-empty: true   # policies 비어 있으면 앱 시작 시 초기 수집 1회 (기본 off)
  oauth:
    # provider 콘솔에 등록하는 redirect_uri와 동일해야 하는 프론트엔드 콜백 라우트
    frontend-callback-uri: ${OAUTH_FRONTEND_CALLBACK_URI:http://localhost:3000/oauth/callback}
    providers:
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      naver:
        client-id: ${NAVER_OAUTH_CLIENT_ID:}
        client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
      kakao:
        client-id: ${KAKAO_OAUTH_CLIENT_ID:}
        client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
